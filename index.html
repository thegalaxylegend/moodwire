  <link rel="alternate" hreflang="en-IN" href="https://examcompass.web.app/" />
  <link rel="alternate" hreflang="en" href="https://examcompass.web.app/" />

  <!-- 🚀 HERO PRELOAD: Slash LCP to <0.5s -->
  <!-- <link rel="preload" as="image" href="/blog-images/units-and-measurements-revision.png" fetchPriority="high"> -->
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&swap">



  <style>
    /* 🚀 EXTREME CRITICAL CSS - Target: <0.5s LCP */
    :root {
      --background: #0f172a; /* Match index.css Deep Slate */
      --primary: #8b5cf6;
    }

    body {
      background: var(--background);
      margin: 0;
      /* System font stack for instant paint */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }

    .boot-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px; /* Match Navbar h-20 */
      display: flex;
      align-items: center;
      padding: 0 24px; /* Match Navbar px-6 */
      z-index: 100;
      box-sizing: border-box;
    }

    .boot-logo {
      font-size: 24px;
      font-weight: 700; /* Match Navbar font-bold */
      letter-spacing: -0.05em; /* Match Navbar tracking-tighter */
      color: #fff;
    }

    .boot-purple { color: #a855f7; } /* Unified Vibrant Purple */

    .boot-content {
      padding-top: 120px; /* Match Navbar offset */
      max-width: 1200px;
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    .boot-skeleton {
      height: 384px; /* Match Blog card h-96 */
      background: rgba(255, 255, 255, 0.03);
      border-radius: 24px;
      margin-bottom: 24px;
      animation: boot-pulse 1.5s infinite ease-in-out;
    }

    @keyframes boot-reveal {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes boot-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.2; }
    }
  </style>
  <!--app-head-->
</head>

<body>
  <script>
    (function () {
      var theme = localStorage.getItem('theme');
      if (theme && theme !== 'glass') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    })();
  </script>
  <div id="root">
    <!--app-html-->
    <div class="boot-shell">
      <nav class="boot-nav">
        <div class="boot-logo">Exam<span class="boot-purple">Compass</span></div>
      </nav>
      <div class="boot-content">
        <div style="margin-bottom: 32px;">
          <div style="height: 48px; background: rgba(255,255,255,0.05); border-radius: 12px; width: 80%; margin-bottom: 16px;"></div>
          <div style="height: 24px; background: rgba(255,255,255,0.03); border-radius: 8px; width: 60%;"></div>
        </div>
        <div style="height: 384px; background: rgba(255, 255, 255, 0.03); border-radius: 24px;"></div>
      </div>
    </div>
    <!--app-html-end-->
  </div>
  <!-- Non-blocking Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&swap"
    rel="stylesheet" media="print" onload="this.media='all'">

  <!-- Google Analytics (Delayed for LCP) -->
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        var gtm = document.createElement('script');
        gtm.src = "https://www.googletagmanager.com/gtag/js?id=G-7MWNJDZ5D0";
        gtm.defer = true;
        document.body.appendChild(gtm);
        
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-7MWNJDZ5D0', { 'send_page_view': false });
      }, /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? 4500 : 1500);
    });
  </script>

  <!-- Entry Point (Last for LCP) -->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
