  <style>
    /* Extreme Critical UI Shell - Optimized for <0.5s LCP */
    :root {
      --background: #020617;
      --surface: #0f172a;
      --primary: #8b5cf6;
      --border: rgba(255, 255, 255, 0.08);
      --text-muted: #94a3b8;
    }

    body {
      background: var(--background);
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
      color: #fff;
    }

    .boot-shell {
      display: flex;
      min-height: 100vh;
    }

    .boot-sidebar {
      width: 256px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: none;
      flex-direction: column;
      flex-shrink: 0;
    }

    @media (min-width: 1024px) {
      .boot-sidebar {
        display: flex;
      }
    }

    .boot-main {
      flex: 1;
      padding: 40px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }

    .boot-header-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }

    .boot-avatar {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: linear-gradient(45deg, var(--primary), #ec4899);
      flex-shrink: 0;
    }

    .boot-welcome {
      font-size: 24px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .boot-sub {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .boot-card {
      height: 180px;
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .boot-pulse {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.8;
      }

      50% {
        opacity: 0.4;
      }
    }

    @media (max-width: 1024px) {
      .boot-main {
        padding: 20px;
      }

      .boot-welcome {
        font-size: 20px;
      }
    }
  </style>
  <!--app-head-->
</head>

<body>
  <script>
    (function () {

      if (theme && theme !== 'glass') {
