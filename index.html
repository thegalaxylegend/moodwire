<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/logo.jpg?v=3" />
  <link rel="apple-touch-icon" href="/logo.jpg?v=3" />
  <link rel="manifest" href="/manifest.json?v=3" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="google-site-verification" content="5028179156f052c6" />

  <!-- Critical Network Preconnects -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://pollinations.ai" />
  <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />
  <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

  <!-- Preload Critical Styles -->
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap"
    as="style" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap"
    rel="stylesheet">

  <!-- Preload Critical Assets -->
  <link rel="preload" href="/astronaut.png" as="image" />

  <!-- Force HTTPS -->
  <script>
    if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost') {
      window.location.href = 'https:' + window.location.href.substring(window.location.protocol.length);
    }
  </script>

  <!-- Google Tag (gtag.js) - Loaded after critical paint -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7MWNJDZ5D0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    window.gtag = gtag;
    gtag('js', new Date());
    gtag('config', 'G-7MWNJDZ5D0', { 'send_page_view': false }); // Defer pageview until client-side hydration
  </script>

  <style>
    /* Extreme Critical UI Shell - Optimized for <0.5s LCP */
    :root {
      --background: #020617;
      --surface: #0f172a;
      --primary: #8b5cf6;
      --border: rgba(255, 255, 255, 0.08);
      --text-muted: #94a3b8;
    }

    body {
      background: var(--background);
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
      color: #fff;
    }

    .boot-shell {
      display: flex;
      min-height: 100vh;
    }

    .boot-sidebar {
      width: 256px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: none;
      flex-direction: column;
      flex-shrink: 0;
    }

    @media (min-width: 1024px) {
      .boot-sidebar {
        display: flex;
      }
    }

    .boot-main {
      flex: 1;
      padding: 40px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }

    .boot-header-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }

    .boot-avatar {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: linear-gradient(45deg, var(--primary), #ec4899);
      flex-shrink: 0;
    }

    .boot-welcome {
      font-size: 24px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .boot-sub {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .boot-card {
      height: 180px;
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .boot-pulse {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.8;
      }

      50% {
        opacity: 0.4;
      }
    }

    @media (max-width: 1024px) {
      .boot-main {
        padding: 20px;
      }

      .boot-welcome {
        font-size: 20px;
      }
    }
  </style>
  <!--app-head-->
</head>

<body>
  <script>
    (function () {
      var theme = localStorage.getItem('theme');
      if (theme && theme !== 'glass') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    })();
  </script>
  <div id="root">
    <!--app-html-->
    <div class="boot-shell">
      <div class="boot-sidebar">
        <div
          style="padding: 32px 24px; font-weight: 900; font-size: 20px; color: var(--primary); letter-spacing: -0.05em;">
          Exam-Compass</div>
        <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px;">
          <div style="height: 48px; width: 100%; background: rgba(255,255,255,0.03); border-radius: 12px;"></div>
          <div style="height: 48px; width: 100%; background: rgba(255,255,255,0.03); border-radius: 12px;"></div>
          <div style="height: 48px; width: 100%; background: rgba(255,255,255,0.03); border-radius: 12px;"></div>
        </div>
      </div>
      <div class="boot-main">
        <div class="boot-header-row">
          <div class="boot-avatar"></div>
          <div>
            <h1 class="boot-welcome">Welcome back, Student.</h1>
            <p class="boot-sub">Syncing your preparation progress...</p>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px;">
          <div class="boot-card boot-pulse"></div>
          <div class="boot-card boot-pulse"></div>
        </div>
      </div>
    </div>
    <!--app-html-end-->
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
