<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Splash Animation Preview</title>
  <style>
    :root {
      --background: #0f172a;
      --primary: #8b5cf6;
    }

    body {
      background: var(--background);
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .launch-container {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--background);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .launch-logo {
      width: 120px;
      height: auto;
      animation: pulse-glow 2s infinite ease-in-out;
    }

    @keyframes pulse-glow {
      0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.5));
      }
      50% {
          transform: scale(1.1);
          filter: drop-shadow(0 0 35px rgba(168, 85, 247, 0.9));
      }
    }
  </style>
</head>
<body>
  <div class="launch-container">
    <img src="logo.png" alt="Exam Compass Launching..." class="launch-logo" />
  </div>
</body>
</html>
