name: Daily Blog Automation (Jules)

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  jules_bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create service-account.json from secret
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEGENDSTECH001 }}' > service-account.json

      - name: Task 1 - Build Queue
        run: npx tsx scripts/chapter-queue-builder.ts

      - name: Task 2 - Generate Blogs
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: npx tsx scripts/blog-generator.ts

      - name: Task 3 - Sync Firestore
        continue-on-error: true
        run: npx tsx scripts/firestore-uploader.ts

      - name: Task 4 - Regenerate SEO Manifest
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEGENDSTECH001 }}
        run: npm run seo:regen

      - name: Task 5 - Rehabilitate Content
        run: node scripts/rehabilitate-blogs.js

      - name: Task 6 - Repair Images
        env:
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: node scripts/repair-images.js

      - name: Commit and Push New Blogs
        run: |
          git config --global user.name 'Jules Blog Bot'
          git config --global user.email 'jules-bot@users.noreply.github.com'
          git add src/content/blogs/*.md
          git add public/blog-images/*
          git add src/data/blogs.ts
          git add public/seo-manifest.json
          git add public/slug-registry.json
          git commit -m "chore: auto-generate blogs and update registries by Jules" || echo "No changes to commit"
          git push origin main

      - name: Send Discord Notification
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -f generated-slugs.txt ]; then
            SLUGS=$(cat generated-slugs.txt)
            if [ -n "$SLUGS" ]; then
              LIST=$(echo "$SLUGS" | sed 's|^|🔗 https://examcompass.pages.dev/blog/|' | awk '{printf "%s\\n", $0}')
              MESSAGE="🚀 **Exam Compass Blog Update!** 🚀\n\nJules just finished his daily task! \n\n**New Blogs Created:**\n$LIST\n\n✅ Generated AI Hero Images.\n✅ SEO Optimized for Quick Revision.\n✅ Deployed to Production."
            else
              MESSAGE="🚀 **Exam Compass Automation Status** 🚀\n\nJules checked the queue. No new blogs were needed today.\n\n🔗 https://examcompass.pages.dev/blog"
            fi
          else
             MESSAGE="🚀 **Exam Compass Blog Update!** 🚀\n\nJules just finished his daily task!\n\nCheck them out here: https://examcompass.pages.dev/blog"
          fi
          curl -X POST -H "Content-Type: application/json" -d "{\"content\": \"$MESSAGE\"}" $DISCORD_WEBHOOK
