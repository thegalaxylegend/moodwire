name: Daily Blog Automation (Jules)

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  jules_bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create service-account.json from secret
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEGENDSTECH001 }}' > service-account.json

      - name: Task 1 - Build Queue
        run: npx tsx scripts/chapter-queue-builder.ts

      - name: Task 2 - Generate Blogs
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx tsx scripts/blog-generator.ts

      - name: Task 3 - Sync Firestore
        id: firestore_sync
        continue-on-error: true
        run: npx tsx scripts/firestore-uploader.ts

      - name: Warn on Firestore failure
        if: steps.firestore_sync.outcome == 'failure'
        run: echo "⚠️ Firestore sync failed — site may serve stale data"

      - name: Task 4 - Regenerate SEO Manifest
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEGENDSTECH001 }}
        run: npm run seo:regen

      - name: Task 5 - Rehabilitate Content
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/rehabilitate-blogs.js

      - name: Task 6 - Repair Images
        env:
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: node scripts/repair-images.js

      - name: Cleanup Secrets
        if: always()
        run: rm -f service-account.json

      - name: Commit and Push New Blogs

        run: |
          git config --global user.name 'Jules Blog Bot'
          git config --global user.email 'jules-bot@users.noreply.github.com'
          git add src/content/blogs/*.md
          git add public/blog-images/*
          git add src/data/blogs.ts
          git add public/seo-manifest.json
          git add public/slug-registry.json
          git commit -m "chore: auto-generate blogs and update registries by Jules" || echo "No changes to commit"
          git push origin main

      - name: Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jules-quality-reports
          path: |
            jules-reports/
            jules-failed/
          retention-days: 30

      - name: Send Discord Notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          REPORT_FILE=$(ls jules-reports/pipeline-*.json | head -n 1)
          if [ -f "$REPORT_FILE" ]; then
            # Extract scores and names for the notification with clickable links
            SCORE_REPORT=$(jq -r '.[] | "▫️ [\\(.slug)](https://examcompass.pages.dev/blog/\\(.slug)): \\(.quality_score)/100 (Status: \\(.status))"' "$REPORT_FILE" | awk '{printf "%s\\n", $0}')
            FAILED_COUNT=$(jq '[.[] | select(.status == "failed")] | length' "$REPORT_FILE")
            
            if [ "$FAILED_COUNT" -gt 0 ]; then
                MESSAGE="🚨 **JULES QUALITY ALERT** 🚨\n\nOne or more blogs failed the quality gate!\n\n**Pipeline Report:**\n$SCORE_REPORT\n\n👉 **Review Failures:** See GitHub Artifacts for details.\n🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            else
                MESSAGE="🚀 **Jules Finished Daily Task!** 🚀\n\n**Quality Scores:**\n$SCORE_REPORT\n\n✅ All posts passed quality gate.\n✅ Deployed to Production."
            fi
          else
             MESSAGE="🚀 **Jules finished daily task!**\n\nNo report was generated (possibly no new blogs today)."
          fi
          curl -X POST -H "Content-Type: application/json" -d "{\"content\": \"$MESSAGE\"}" $DISCORD_WEBHOOK

