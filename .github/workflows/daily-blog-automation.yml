name: Daily Blog Automation (Jules)

on:
  schedule:
    - cron: '30 18 * * *' # Midnight India Time (6 hours buffer for 6 AM target)
  workflow_dispatch: # Allows manual trigger

jobs:
  jules_bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create service-account.json from secret
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEGENDSTECH001 }}' > service-account.json

      - name: Clean Old Reports
        run: rm -f jules-reports/pipeline-*.json

      - name: Task 1 - Build Queue
        run: npx tsx scripts/chapter-queue-builder.ts

      - name: Task 2 - Generate Blogs
        id: blog_gen
        continue-on-error: true
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VITE_GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          VITE_GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          VITE_GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          VITE_GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          VITE_GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx tsx scripts/blog-generator.ts

      - name: Task 3 - Sync Firestore
        id: firestore_sync
        continue-on-error: true
        run: npx tsx scripts/firestore-uploader.ts

      - name: Warn on Firestore failure
        if: steps.firestore_sync.outcome == 'failure'
        run: echo "⚠️ Firestore sync failed — site may serve stale data"

      - name: Task 4 - Regenerate SEO Manifest
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEGENDSTECH001 }}
        run: npm run seo:regen

      - name: Task 5 - Rehabilitate Content
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/rehabilitate-blogs.js

      - name: Task 6 - Repair Images
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VITE_GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          VITE_GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          VITE_GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          VITE_GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          VITE_GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/repair-images.js

      - name: Cleanup Secrets
        if: always()
        run: rm -f service-account.json

      - name: Quality Gate Check
        id: quality_gate
        run: |
          REPORT_FILE=$(ls -t jules-reports/pipeline-*.json 2>/dev/null | head -n 1 || true)
          if [ -f "$REPORT_FILE" ]; then
            TOTAL=$(jq 'length' "$REPORT_FILE")
            FAILED=$(jq '[.[] | select(.status == "failed" or .quality_score < 100)] | length' "$REPORT_FILE")
            PERFECT=$(jq '[.[] | select(.quality_score == 100)] | length' "$REPORT_FILE")
            echo "📊 Quality Gate: $PERFECT/$TOTAL blogs scored 100/100. $FAILED failed."
            if [ "$PERFECT" -gt "0" ]; then
              echo "✅ $PERFECT blog(s) passed 100/100. Deploying passing blogs."
              echo "gate_passed=true" >> $GITHUB_OUTPUT
            else
              echo "🚫 BLOCKED: 0 blogs achieved 100/100. Deployment blocked."
              echo "gate_passed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ No pipeline report found. Nothing to deploy."
            echo "gate_passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push New Blogs
        if: steps.quality_gate.outputs.gate_passed == 'true'
        run: |
          git config --global user.name 'Jules Blog Bot'
          git config --global user.email 'jules-bot@users.noreply.github.com'
          git add src/content/blogs/*.md
          git add public/blog-images/*
          git add src/data/blogs.ts
          git add public/seo-manifest.json
          git add public/slug-registry.json
          git commit -m "chore: auto-generate blogs (100/100 quality) by Jules" || echo "No changes to commit"
          git push origin main

      - name: Deployment Blocked Notice
        if: steps.quality_gate.outputs.gate_passed != 'true'
        run: |
          echo "🚫 Deployment was blocked because no blogs achieved 100/100 quality."
          echo "🔍 Check the quality reports artifact for details."

      - name: Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jules-quality-reports
          path: |
            jules-reports/
            jules-failed/
          retention-days: 30

      - name: Send Discord Notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          REPORT_FILE=$(ls -t jules-reports/pipeline-*.json 2>/dev/null | head -n 1 || true)
          RUN_URL="https://github.com/thegalaxylegend/examcompass/actions/runs/${{ github.run_id }}"
          SITE_URL="https://examcompass.pages.dev/blog"
          
          if [ -f "$REPORT_FILE" ]; then
            echo "📊 Processing quality report..."
            
            TOTAL=$(jq 'length' "$REPORT_FILE")
            PASS_COUNT=$(jq '[.[] | select(.status != "failed")] | length' "$REPORT_FILE")
            FAIL_COUNT=$(jq '[.[] | select(.status == "failed")] | length' "$REPORT_FILE")
            
            if [ "$FAIL_COUNT" -gt "0" ]; then
              COLOR=15548997
              TITLE="🚨 Jules Quality Alert"
            else
              COLOR=5763719
              TITLE="🚀 Jules Finished Daily Task!"
            fi
            
            # Build embed fields array from report
            FIELDS=$(jq -c '[.[] | {
              name: (.slug | split("-") | map(. | explode | map(if . >= 97 and . <= 122 then . - 32 else . end) | implode)[0:3] | join(" ")),
              value: ("Score: **\(.quality_score)/100**\nStatus: \(.status)\n[View Blog](https://examcompass.pages.dev/blog/\(.slug))"),
              inline: true
            }]' "$REPORT_FILE")
            
            # Build the Discord payload using jq for safe JSON
            jq -n \
              --arg title "$TITLE" \
              --argjson color "$COLOR" \
              --arg desc "**$PASS_COUNT/$TOTAL** blogs published successfully. **$FAIL_COUNT** failed quality gate." \
              --arg footer "Pipeline Run • $(date -u +'%Y-%m-%d %H:%M UTC')" \
              --arg run_url "$RUN_URL" \
              --argjson fields "$FIELDS" \
              '{
                embeds: [{
                  title: $title,
                  description: $desc,
                  color: $color,
                  fields: $fields,
                  footer: { text: $footer },
                  url: $run_url
                }]
              }' > discord_payload.json
            
          else
            echo "❓ No report found."
            jq -n '{
              embeds: [{
                title: "📅 Daily Automation Complete",
                description: "No new blogs were generated today. The queue was empty or all topics were already covered.",
                color: 8421504
              }]
            }' > discord_payload.json
          fi

          # Send to Discord
          curl -s -H "Content-Type: application/json" -d @discord_payload.json "$DISCORD_WEBHOOK_URL"

