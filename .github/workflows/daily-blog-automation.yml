name: Daily Blog Automation (Jules)

on:
  schedule:
    - cron: '30 18 * * *' # Midnight India Time (6 hours buffer for 6 AM target)
  workflow_dispatch: # Allows manual trigger

jobs:
  jules_bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create service-account.json from secret
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEGENDSTECH001 }}' > service-account.json

      - name: Task 1 - Build Queue
        run: npx tsx scripts/chapter-queue-builder.ts

      - name: Task 2 - Generate Blogs
        id: blog_gen
        continue-on-error: true
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VITE_GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          VITE_GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          VITE_GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          VITE_GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          VITE_GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx tsx scripts/blog-generator.ts

      - name: Task 3 - Sync Firestore
        id: firestore_sync
        continue-on-error: true
        run: npx tsx scripts/firestore-uploader.ts

      - name: Warn on Firestore failure
        if: steps.firestore_sync.outcome == 'failure'
        run: echo "⚠️ Firestore sync failed — site may serve stale data"

      - name: Task 4 - Regenerate SEO Manifest
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEGENDSTECH001 }}
        run: npm run seo:regen

      - name: Task 5 - Rehabilitate Content
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/rehabilitate-blogs.js

      - name: Task 6 - Repair Images
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VITE_GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          VITE_GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          VITE_GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          VITE_GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          VITE_GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GEMINI_BACKUP_KEY: ${{ secrets.GEMINI_BACKUP_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/repair-images.js

      - name: Cleanup Secrets
        if: always()
        run: rm -f service-account.json

      - name: Commit and Push New Blogs

        run: |
          git config --global user.name 'Jules Blog Bot'
          git config --global user.email 'jules-bot@users.noreply.github.com'
          git add src/content/blogs/*.md
          git add public/blog-images/*
          git add src/data/blogs.ts
          git add public/seo-manifest.json
          git add public/slug-registry.json
          git commit -m "chore: auto-generate blogs and update registries by Jules" || echo "No changes to commit"
          git push origin main

      - name: Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jules-quality-reports
          path: |
            jules-reports/
            jules-failed/
          retention-days: 30

      - name: Send Discord Notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          REPORT_FILE=$(ls jules-reports/pipeline-*.json 2>/dev/null | head -n 1 || true)
          
          if [ -f "$REPORT_FILE" ]; then
            echo "📊 Processing quality report..."
            
            # 1. Check for Critical Failures
            FAIL_COUNT=$(jq '[.[] | select(.status == "failed" or .quality_score < 80)] | length' "$REPORT_FILE")
            
            # 2. Extract Scores with clickable links
            SCORE_LIST=$(jq -r '.[] | "▫️ [\(.slug)](https://examcompass.pages.dev/blog/\(.slug)): \(.quality_score)/100 (Status: \(.status))"' "$REPORT_FILE")
            
            if [ "$FAIL_COUNT" -gt "0" ]; then
              # Failure/Quality Alert Message
              TITLE="🚨 JULES QUALITY ALERT 🚨"
              DESC="One or more blogs failed the quality gate or have low scores."
              COLOR=15548997 # Red
            else
              # Success Message
              TITLE="🚀 Jules Finished Daily Task! 🚀"
              DESC="All blogs passed the quality gate and are live."
              COLOR=5763719 # Green
            fi
            
            # Construct Final Message
            MSG="${TITLE}\n\n${DESC}\n\n**Pipeline Report:**\n${SCORE_LIST}\n\n👉 [Review Run in GitHub](https://github.com/thegalaxylegend/examcompass/actions/runs/${{ github.run_id }})"
            
            # Create Payload safely using jq
            jq -n --arg msg "$MSG" --argjson color "$COLOR" '{
              content: $msg,
              embeds: [{
                title: "Grandmaster Blog Pipeline",
                color: $color
              }]
            }' > discord_payload.json
            
          else
            echo "❓ No report found."
            jq -n --arg msg "📅 **Daily automation finished.** No new blogs were generated or skipped." '{content: $msg}' > discord_payload.json
          fi

          # Send to Discord
          curl -H "Content-Type: application/json" -d @discord_payload.json "$DISCORD_WEBHOOK_URL"

