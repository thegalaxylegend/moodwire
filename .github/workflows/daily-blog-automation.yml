name: Daily Blog Automation (Jules)

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC (~5:30 AM IST) - Matches API reset
  workflow_dispatch: # Allows manual trigger

concurrency:
  group: blog-automation
  cancel-in-progress: false

jobs:
  jules_bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create service-account.json from secret
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEGENDSTECH001 }}' > service-account.json

      - name: Archive & Clean Reports
        run: |
          # Archive previous reports instead of destroying them
          if [ -d "jules-reports" ] && [ "$(ls -A jules-reports/ 2>/dev/null)" ]; then
            ARCHIVE_DIR="jules-reports/archive/$(date -u +%Y-%m-%d)"
            mkdir -p "$ARCHIVE_DIR"
            # Move pipeline reports (critical for trend analysis) to archive
            mv jules-reports/pipeline-*.json "$ARCHIVE_DIR/" 2>/dev/null || true
            mv jules-reports/repair-*.json "$ARCHIVE_DIR/" 2>/dev/null || true
            mv jules-reports/decay-*.json "$ARCHIVE_DIR/" 2>/dev/null || true
            mv jules-reports/linking-*.json "$ARCHIVE_DIR/" 2>/dev/null || true
            mv jules-reports/duplication-*.json "$ARCHIVE_DIR/" 2>/dev/null || true
            mv jules-reports/freshness-*.json "$ARCHIVE_DIR/" 2>/dev/null || true
            # Clean transient files that are regenerated each run
            rm -f jules-reports/*-discord-payload.json 2>/dev/null || true
            rm -f jules-reports/autopsy-report.json 2>/dev/null || true
            # NOTE: regen-queue-*.json files are preserved here — they are consumed
            # by Task 2.1 (refine-only pass) and cleaned up after that step.
            # Keep persistent intelligence files: quality-trends, lessons-learned, 
            # generation-strategy, content-patterns, evolved-prompt, self-improve-log
            echo "📦 Archived previous reports to $ARCHIVE_DIR"
          fi
          # Keep only last 14 archive directories to prevent unbounded growth
          if [ -d "jules-reports/archive" ]; then
            ls -dt jules-reports/archive/*/ 2>/dev/null | tail -n +15 | xargs rm -rf 2>/dev/null || true
          fi
          rm -rf jules-failed/*
          rm -f generated-slugs.txt 2>/dev/null || true
          touch run.log
          echo "[]" > jules-reports/dead-letter-queue.json

      - name: Task 0.5 - Content Freshness Auto-Update (Pre-Generation)
        run: npx tsx scripts/auto-refresh-blogs.ts

      - name: Task 1 - Build Queue
        run: npx tsx scripts/chapter-queue-builder.ts | tee -a run.log

      - name: Task 2 - Generate Blogs
        id: blog_gen
        continue-on-error: true
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VITE_GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          VITE_GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          VITE_GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          VITE_GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          VITE_GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY_2: ${{ secrets.VITE_GEMINI_API_KEY_2 }}
          VITE_GEMINI_API_KEY_3: ${{ secrets.VITE_GEMINI_API_KEY_3 }}
          VITE_GEMINI_API_KEY_4: ${{ secrets.VITE_GEMINI_API_KEY_4 }}
          VITE_GEMINI_API_KEY_5: ${{ secrets.VITE_GEMINI_API_KEY_5 }}
          VITE_GEMINI_API_KEY_6: ${{ secrets.VITE_GEMINI_API_KEY_6 }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx tsx scripts/blog-generator.ts --new-only | tee -a run.log

      - name: Task 2.1 - Refinement-Only Pass (6 Refinements)
        id: refine_pass
        continue-on-error: true
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VITE_GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          VITE_GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          VITE_GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          VITE_GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          VITE_GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY_2: ${{ secrets.VITE_GEMINI_API_KEY_2 }}
          VITE_GEMINI_API_KEY_3: ${{ secrets.VITE_GEMINI_API_KEY_3 }}
          VITE_GEMINI_API_KEY_4: ${{ secrets.VITE_GEMINI_API_KEY_4 }}
          VITE_GEMINI_API_KEY_5: ${{ secrets.VITE_GEMINI_API_KEY_5 }}
          VITE_GEMINI_API_KEY_6: ${{ secrets.VITE_GEMINI_API_KEY_6 }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx tsx scripts/blog-generator.ts --refine-only | tee -a run.log

      - name: Task 2.15 - Cleanup Consumed Regen Queues
        run: rm -f jules-reports/regen-queue-*.json 2>/dev/null || true

      - name: Task 2.2 - Sync Blog Registry
        run: |
          echo "🔄 Syncing blog registry (blogs.ts) from content directory..."
          node scripts/sync-blogs.js
          echo "✅ Blog registry synced"

      - name: Task 2.5 - Patch Generator (Self-Healing)
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VITE_GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          VITE_GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          VITE_GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          VITE_GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          VITE_GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY_2: ${{ secrets.VITE_GEMINI_API_KEY_2 }}
          VITE_GEMINI_API_KEY_3: ${{ secrets.VITE_GEMINI_API_KEY_3 }}
          VITE_GEMINI_API_KEY_4: ${{ secrets.VITE_GEMINI_API_KEY_4 }}
          VITE_GEMINI_API_KEY_5: ${{ secrets.VITE_GEMINI_API_KEY_5 }}
          VITE_GEMINI_API_KEY_6: ${{ secrets.VITE_GEMINI_API_KEY_6 }}
        # run: npx tsx scripts/patch-generator.ts
        run: echo "Skipping patch-generator in favor of smart-repair."

      - name: Task 3 - Sync Firestore
        id: firestore_sync
        continue-on-error: true
        run: npx tsx scripts/firestore-uploader.ts

      - name: Warn on Firestore failure
        if: steps.firestore_sync.outcome == 'failure'
        run: echo "⚠️ Firestore sync failed — site may serve stale data"

      - name: "Task 3.5 - NEXUS v2: Firestore Auto-Backup"
        continue-on-error: true
        run: npx tsx scripts/firestore-backup.ts

      - name: "Task 4 - Regenerate SEO Manifest"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEGENDSTECH001 }}
        run: npm run seo:regen

      - name: "Task 4.5 - IndexNow Submission"
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_HOST: "examcompass.pages.dev"
        run: node scripts/ping-indexnow.js

      - name: Task 5 - Populate Questions (Live Generation)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEGENDSTECH001 }}
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VITE_GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          VITE_GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          VITE_GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          VITE_GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          VITE_GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY_2: ${{ secrets.VITE_GEMINI_API_KEY_2 }}
          VITE_GEMINI_API_KEY_3: ${{ secrets.VITE_GEMINI_API_KEY_3 }}
          VITE_GEMINI_API_KEY_4: ${{ secrets.VITE_GEMINI_API_KEY_4 }}
          VITE_GEMINI_API_KEY_5: ${{ secrets.VITE_GEMINI_API_KEY_5 }}
          VITE_GEMINI_API_KEY_6: ${{ secrets.VITE_GEMINI_API_KEY_6 }}
        run: npx tsx scripts/populate-questions.ts


      - name: Task 6 - Repair Images
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VITE_GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          VITE_GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          VITE_GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          VITE_GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          VITE_GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY_2: ${{ secrets.VITE_GEMINI_API_KEY_2 }}
          VITE_GEMINI_API_KEY_3: ${{ secrets.VITE_GEMINI_API_KEY_3 }}
          VITE_GEMINI_API_KEY_4: ${{ secrets.VITE_GEMINI_API_KEY_4 }}
          VITE_GEMINI_API_KEY_5: ${{ secrets.VITE_GEMINI_API_KEY_5 }}
          VITE_GEMINI_API_KEY_6: ${{ secrets.VITE_GEMINI_API_KEY_6 }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/repair-images.js

      - name: "Task 6.5 - NEXUS v2: Image Health Check"
        continue-on-error: true
        run: npx tsx scripts/image-health-check.ts

      # NOTE: Freshness check moved to Task 0.5 (before generation) so its
      # regen-queue feeds into the refine-only pass. This slot is now a no-op.
      - name: Task 7 - Content Freshness (Moved to Pre-Generation)
        run: echo "✅ Freshness check already ran as Task 0.5 before blog generation."

      - name: Task 8 - Smart Auto-Repair
        continue-on-error: true
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VITE_GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          VITE_GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          VITE_GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          VITE_GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          VITE_GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY_2: ${{ secrets.VITE_GEMINI_API_KEY_2 }}
          VITE_GEMINI_API_KEY_3: ${{ secrets.VITE_GEMINI_API_KEY_3 }}
          VITE_GEMINI_API_KEY_4: ${{ secrets.VITE_GEMINI_API_KEY_4 }}
          VITE_GEMINI_API_KEY_5: ${{ secrets.VITE_GEMINI_API_KEY_5 }}
          VITE_GEMINI_API_KEY_6: ${{ secrets.VITE_GEMINI_API_KEY_6 }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: npx tsx scripts/smart-repair.ts

      - name: Task 9 - Generate Schema Markup
        continue-on-error: true
        run: npx tsx scripts/generate-schema.ts

      - name: "Task 9.5 - NEXUS v2: Auto Sitemap Regeneration"
        continue-on-error: true
        run: npx tsx scripts/auto-sitemap.ts

      - name: "Task 9.6 - NEXUS v2: RSS Feed Generation"
        continue-on-error: true
        run: npx tsx scripts/generate-rss.ts

      - name: Task 10 - Quality Trends Analysis
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npx tsx scripts/quality-tracker.ts

      - name: Task 11 - Internal Linking Optimizer
        run: |
          npx tsx scripts/internal-linker.ts 2>&1 | tee -a run.log || {
            echo "{\"task\":\"internal-linker\",\"exitCode\":$?,\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> jules-reports/dead-letter-queue.json
            echo "⚠️ Task 11 failed — logged to dead-letter-queue"
          }

      - name: "Task 11.5 - NEXUS v2: Broken Link Checker"
        continue-on-error: true
        run: npx tsx scripts/broken-link-checker.ts

      - name: Task 12 - Duplication Checker
        run: |
          npx tsx scripts/duplication-checker.ts 2>&1 | tee -a run.log || {
            echo "{\"task\":\"duplication-checker\",\"exitCode\":$?,\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> jules-reports/dead-letter-queue.json
            echo "⚠️ Task 12 failed — logged to dead-letter-queue"
          }

      - name: Task 13 - Failed Blog Autopsy
        run: |
          npx tsx scripts/failed-autopsy.ts 2>&1 | tee -a run.log || {
            echo "{\"task\":\"failed-autopsy\",\"exitCode\":$?,\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> jules-reports/dead-letter-queue.json
            echo "⚠️ Task 13 failed — logged to dead-letter-queue"
          }

      - name: Task 14 - Content Pattern Analysis
        run: |
          npx tsx scripts/content-patterns.ts 2>&1 | tee -a run.log || {
            echo "{\"task\":\"content-patterns\",\"exitCode\":$?,\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> jules-reports/dead-letter-queue.json
            echo "⚠️ Task 14 failed — logged to dead-letter-queue"
          }

      - name: Task 15 - Self-Documenting Changelog
        run: |
          npx tsx scripts/self-changelog.ts 2>&1 | tee -a run.log || {
            echo "{\"task\":\"self-changelog\",\"exitCode\":$?,\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> jules-reports/dead-letter-queue.json
            echo "⚠️ Task 15 failed — logged to dead-letter-queue"
          }

      - name: Task 16 - Google Search Console Intelligence
        run: |
          npx tsx scripts/google-search-console.ts 2>&1 | tee -a run.log || {
            echo "{\"task\":\"google-search-console\",\"exitCode\":$?,\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> jules-reports/dead-letter-queue.json
            echo "⚠️ Task 16 failed — logged to dead-letter-queue"
          }

      - name: Task 17 - Search Opportunity Optimization
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: |
          npx tsx scripts/meta-optimizer.ts 2>&1 | tee -a run.log || {
            echo "{\"task\":\"meta-optimizer\",\"exitCode\":$?,\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> jules-reports/dead-letter-queue.json
            echo "⚠️ Task 17 failed — logged to dead-letter-queue"
          }

      - name: Task 18 - Syllabus Completion Stats
        run: |
          npx tsx scripts/syllabus-stats.ts 2>&1 | tee -a run.log || {
            echo "{\"task\":\"syllabus-stats\",\"exitCode\":$?,\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> jules-reports/dead-letter-queue.json
            echo "⚠️ Task 18 failed — logged to dead-letter-queue"
          }

      - name: Task 19 - Prompt Evolution (THE BRAIN)
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VITE_GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          VITE_GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          VITE_GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          VITE_GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          VITE_GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
        run: |
          npx tsx scripts/prompt-evolution.ts 2>&1 | tee -a run.log || {
            echo "{\"task\":\"prompt-evolution\",\"exitCode\":$?,\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> jules-reports/dead-letter-queue.json
            echo "⚠️ Task 19 failed — logged to dead-letter-queue"
          }

      - name: Task 20 - Content Decay Detection
        run: |
          npx tsx scripts/content-decay.ts 2>&1 | tee -a run.log || {
            echo "{\"task\":\"content-decay\",\"exitCode\":$?,\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> jules-reports/dead-letter-queue.json
            echo "⚠️ Task 20 failed — logged to dead-letter-queue"
          }

      - name: Task 21 - Automated Social Distribution (𝕏 & 🧵)
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VITE_GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          VITE_GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          VITE_GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          VITE_GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          npm run social:threads -- --recent 2>&1 | tee -a run.log || {
            echo "{\"task\":\"social-distribution\",\"exitCode\":$?,\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> jules-reports/dead-letter-queue.json
            echo "⚠️ Task 21 failed — logged to dead-letter-queue"
          }

      - name: "Task 21.5 - NEXUS v2: Dead Letter Queue Processor"
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          DLQ="jules-reports/dead-letter-queue.json"
          if [ -f "$DLQ" ] && [ "$(cat $DLQ | jq 'length')" -gt 0 ] 2>/dev/null; then
            FAILED_COUNT=$(jq 'length' "$DLQ")
            FAILED_TASKS=$(jq -r '.[].task // "unknown"' "$DLQ" | sort -u | tr '\n' ', ')
            echo "🚨 DEAD LETTER QUEUE: $FAILED_COUNT failed task(s): $FAILED_TASKS"
            
            # Send Discord alert if webhook is configured
            if [ -n "$DISCORD_WEBHOOK_URL" ]; then
              TASK_LIST=$(jq -r '.[] | "• \(.task // "unknown") at \(.time // "unknown")"' "$DLQ" | head -n 10)
              jq -n \
                --arg count "$FAILED_COUNT" \
                --arg tasks "$TASK_LIST" \
                '{
                  embeds: [{
                    title: "🚨 Dead Letter Queue Alert",
                    description: ("**" + $count + " task(s) failed silently:**\n" + $tasks),
                    color: 15548997,
                    footer: { text: "Jules Nexus v2 — Dead Letter Processor" }
                  }]
                }' > dlq-payload.json
              curl -s -H "Content-Type: application/json" -d @dlq-payload.json "$DISCORD_WEBHOOK_URL" || true
              rm -f dlq-payload.json
              echo "📡 Dead Letter Queue alert sent to Discord."
            fi
          else
            echo "✅ Dead Letter Queue is empty — all tasks completed successfully."
          fi

      - name: "Task 21.8 - NEXUS v2: Hindi Blog Translation (3/day)"
        continue-on-error: true
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY_2: ${{ secrets.VITE_GEMINI_API_KEY_2 }}
          VITE_GEMINI_API_KEY_3: ${{ secrets.VITE_GEMINI_API_KEY_3 }}
          VITE_GEMINI_API_KEY_4: ${{ secrets.VITE_GEMINI_API_KEY_4 }}
          VITE_GEMINI_API_KEY_5: ${{ secrets.VITE_GEMINI_API_KEY_5 }}
          VITE_GEMINI_API_KEY_6: ${{ secrets.VITE_GEMINI_API_KEY_6 }}
        run: npx tsx scripts/hindi-translator.ts

      - name: Task 22 - Final Sanity Guard
        id: sanity_guard
        run: npx tsx scripts/sanity-guard.ts

      - name: Cleanup Secrets
        if: always()
        run: rm -f service-account.json

      - name: Quality Gate Check
        id: quality_gate
        run: |
          REPORT_FILE=$(ls -t jules-reports/pipeline-*.json 2>/dev/null | head -n 1 || true)
          if [ -f "$REPORT_FILE" ]; then
            TOTAL=$(jq 'length' "$REPORT_FILE")
            FAILED=$(jq '[.[] | select(.status == "failed" or .quality_score < 90)] | length' "$REPORT_FILE")
            DEPLOYABLE=$(jq '[.[] | select(.quality_score >= 90)] | length' "$REPORT_FILE")
            echo "📊 Quality Gate: $DEPLOYABLE/$TOTAL blogs are deployable (score >= 90). $FAILED failed."
            if [ "$DEPLOYABLE" -gt "0" ]; then
              echo "✅ $DEPLOYABLE blog(s) passed (>= 90). Deploying passing blogs."
              echo "gate_passed=true" >> $GITHUB_OUTPUT
            else
              echo "🚫 BLOCKED: 0 blogs achieved 90/100. Deployment blocked."
              echo "gate_passed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ No pipeline report found. Nothing to deploy."
            echo "gate_passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push New Blogs
        if: (steps.quality_gate.outputs.gate_passed == 'true' || github.event_name == 'workflow_dispatch') && steps.sanity_guard.outcome == 'success'
        run: |
          git config --global user.name 'Jules Blog Bot'
          git config --global user.email 'jules-bot@users.noreply.github.com'
          git add src/content/blogs/*.md
          git add src/content/blogs-hi/*.md || true
          git add public/blog-images/*
          git add src/data/blogs.ts
          git add public/seo-manifest.json
          git add public/slug-registry.json
          git add public/schema-data.json || true
          git add public/sitemap*.xml || true
          git add public/feed.xml public/rss.xml || true
          git add public/jules-reports/*.json || true
          git add jules-reports/*.json || true
          git add jules-reports/archive/ || true
          git add JULES_CHANGELOG.md || true
          
          # Build descriptive commit message with run context
          RUN_DATE=$(date -u +"%Y-%m-%d")
          REPORT_FILE=$(ls -t jules-reports/pipeline-*.json 2>/dev/null | head -n 1 || true)
          BLOG_COUNT=0
          AVG_SCORE=0
          if [ -f "$REPORT_FILE" ]; then
            BLOG_COUNT=$(jq 'length' "$REPORT_FILE" 2>/dev/null || echo "0")
            AVG_SCORE=$(jq '[.[].quality_score // 0] | add / length | floor' "$REPORT_FILE" 2>/dev/null || echo "0")
          fi
          
          git commit -m "chore(jules): ${RUN_DATE} — ${BLOG_COUNT} blogs (avg ${AVG_SCORE}/100)" || echo "No changes to commit"
          git push origin main


      - name: Trigger Cloudflare Pages Deploy
        if: steps.quality_gate.outputs.gate_passed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/examcompass/deployments" \
               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
               -H "Content-Type: application/json" \
               -d '{"branch": "main"}'
          echo "🚀 Triggered Cloudflare Pages deployment for new blogs!"

      - name: "NEXUS v2: Ping Sitemaps to Search Engines"
        if: steps.quality_gate.outputs.gate_passed == 'true'
        continue-on-error: true
        run: npx tsx scripts/auto-sitemap.ts --ping

      - name: "NEXUS v2: Purge Cloudflare CDN Cache"
        if: steps.quality_gate.outputs.gate_passed == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -n "$CLOUDFLARE_ZONE_ID" ]; then
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"purge_everything": true}'
            echo "🧹 Cloudflare cache purged!"
          else
            echo "ℹ️ CLOUDFLARE_ZONE_ID not set — skipping cache purge."
          fi

      - name: Task 7 - Ping Google Indexing API
        if: steps.quality_gate.outputs.gate_passed == 'true'
        env:
          GOOGLE_INDEXING_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT }}
        run: npm run seo:indexing

      - name: Deployment Blocked Notice
        if: steps.quality_gate.outputs.gate_passed != 'true'
        run: |
          echo "🚫 Deployment was blocked because no blogs achieved 90/100 quality."
          echo "🔍 Check the quality reports artifact for details."

      - name: Automated Social Distribution (Discord Community)
        if: steps.quality_gate.outputs.gate_passed == 'true'
        env:
          DISCORD_PUBLIC_WEBHOOK_URL: ${{ secrets.DISCORD_PUBLIC_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_PUBLIC_WEBHOOK_URL" ]; then
            echo "Skipping public distribution: DISCORD_PUBLIC_WEBHOOK_URL secret not set. Please add this to GitHub secrets to enable auto-posting!"
            exit 0
          fi
          
          REPORT_FILE=$(ls -t jules-reports/pipeline-*.json 2>/dev/null | head -n 1 || true)
          if [ -f "$REPORT_FILE" ]; then
            # Extract successfully generated blogs
            jq -c '.[] | select(.status != "failed")' "$REPORT_FILE" | while read -r blog; do
              SLUG=$(echo "$blog" | jq -r '.slug')
              # Convert slug to Title Case
              TITLE=$(echo "$SLUG" | tr '-' ' ' | awk '{for(i=1;i<=NF;i++)sub(/./,toupper(substr($i,1,1)),$i)}1')
              URL="https://examcompass.pages.dev/blog/$SLUG"
              IMG_URL="https://examcompass.pages.dev/blog-images/$SLUG.webp"
              
              jq -n \
                --arg content "🚀 **New Study Guide Just Dropped!**" \
                --arg title "$TITLE" \
                --arg url "$URL" \
                --arg desc "Crush your exams with today's new Grandmaster Guide. Contains Ayush's personal revision notes, trap questions, and high-yield MCQs! 🎯\n\n[**Read the Full Guide Here →**]($url)" \
                '{
                  content: $content,
                  embeds: [{
                    title: $title,
                    url: $url,
                    description: $desc,
                    color: 3447003,
                    image: { url: $url }
                  }]
                }' > public_payload.json
              
              # Fix image url passing
              jq --arg img "$IMG_URL" '.embeds[0].image.url = $img' public_payload.json > final_payload.json
              
              curl -s -H "Content-Type: application/json" -d @final_payload.json "$DISCORD_PUBLIC_WEBHOOK_URL"
              sleep 2
            done
            echo "📢 Successfully broadcasted new blogs to community!"
          fi

      - name: Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jules-quality-reports
          path: |
            jules-reports/
            jules-failed/
          retention-days: 30

      - name: "Task 23 - AI Log Autopsy (Auditor)"
        if: always()
        continue-on-error: true
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VITE_GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          VITE_GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          VITE_GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          VITE_GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npx tsx scripts/monitor-autopsy.ts

      - name: "Task 24 - Discord Pulse: New Content"
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npx tsx scripts/utils/discord-pulse.ts --new

      - name: "Task 25 - Discord Pulse: Refined Content"
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npx tsx scripts/utils/discord-pulse.ts --refined

      - name: "Task 26 - Discord Pulse: System Pulse Audit"
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npx tsx scripts/utils/discord-pulse.ts --pulse

      - name: "Task 27 - NEXUS v2: Weekly Performance Report (Sundays Only)"
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npx tsx scripts/weekly-report.ts

