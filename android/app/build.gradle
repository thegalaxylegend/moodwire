apply plugin: 'com.android.application'

android {
    namespace = "app.web.examcompass"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.web.examcompass"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // ─── Signing Configs ─────────────────────────────────────────────────────
    // For release builds, credentials are read from environment variables so
    // that the keystore is NEVER committed to source control.
    //
    // HOW TO SET UP:
    //   1. Generate a release keystore:
    //      keytool -genkey -v -keystore examcompass-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias examcompass
    //   2. Set these env vars in your CI/CD pipeline or local shell:
    //      EXAMCOMPASS_STORE_FILE    = absolute path to examcompass-release.jks
    //      EXAMCOMPASS_STORE_PASSWORD = keystore password
    //      EXAMCOMPASS_KEY_ALIAS      = key alias (e.g. "examcompass")
    //      EXAMCOMPASS_KEY_PASSWORD   = key password
    //   3. Run: ./gradlew assembleRelease
    //
    // LOCAL FALLBACK: If env vars are not set (e.g. a dev machine), the build
    // falls back to the debug key so that `npx cap sync` still works.
    // ─────────────────────────────────────────────────────────────────────────
    signingConfigs {
        release {
            def storeFilePath = System.getenv("EXAMCOMPASS_STORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("EXAMCOMPASS_STORE_PASSWORD")
                keyAlias System.getenv("EXAMCOMPASS_KEY_ALIAS")
                keyPassword System.getenv("EXAMCOMPASS_KEY_PASSWORD")
            } else {
                // Fallback to debug key for local development only.
                // Produces a debug-signed APK — NOT suitable for store submission.
                storeFile signingConfigs.debug.storeFile
                storePassword signingConfigs.debug.storePassword
                keyAlias signingConfigs.debug.keyAlias
                keyPassword signingConfigs.debug.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

task cleanUnwantedAssets(type: Delete) {
    description = "Cleans up massive web assets that are not needed by the native app wrapper to reduce APK size"
    delete fileTree(dir: "src/main/assets/public", includes: [
        "sherpa-onnx-wasm-main-tts.wasm",
        "espeak-ng-data.tar.bz2",
        "espeak-ng-data/**",
        "assets/**",
        "**/*.apk",
        "local-db.json",
        "question-db.json",
        "seo-manifest.json",
        "schema-data.json",
        "slug-registry.json",
        "real-questions.json",
        "topic-content-db.json",
        "**/*.xml",
        "blog/**",
        "jee-mains/**",
        "jee-advanced/**",
        "neet/**",
        "class-10/**",
        "class-11/**",
        "class-12/**",
        "class-8/**",
        "class-9/**",
        "blog-images/**",
        "blogs/**",
        "founder/**",
        "images/**",
        "jules-reports/**",
        "models/**",
        "about/**",
        "contact/**",
        "privacy/**",
        "terms/**",
        "founder.jpg",
        "og-image.png",
        "server/**"
    ])
}

// Automatically run before assets are merged into the final APK
tasks.whenTaskAdded { task ->
    if (task.name.startsWith("merge") && task.name.endsWith("Assets")) {
        task.dependsOn cleanUnwantedAssets
    }
}
